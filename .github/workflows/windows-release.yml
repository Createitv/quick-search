name: Windows package and release

on:
  push:
    branches: [main, feature/quick-search]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      EVERYTHING_VERSION: 1.4.1.1032
      EVERYTHING_INSTALLER_SHA256: c42efad041d4c0bb4d4ac97ae7cbe89f153ec1fe078772392e749c7f5d5282d3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } else {
            'v0.1.0-ci'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid version tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $number = $tag.TrimStart('v')
          "number=$number" >> $env:GITHUB_OUTPUT
          "assembly_number=$($number.Split('-')[0])" >> $env:GITHUB_OUTPUT

      - name: Download official Everything x64 SDK DLL
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.voidtools.com/Everything-SDK.zip -OutFile Everything-SDK.zip
          Expand-Archive Everything-SDK.zip -DestinationPath Everything-SDK
          New-Item -ItemType Directory -Force src/QuickSearch.Windows/native | Out-Null
          Copy-Item Everything-SDK/dll/Everything64.dll src/QuickSearch.Windows/native/Everything64.dll

      - name: Download and verify official Everything x64 installer
        shell: pwsh
        run: |
          $fileName = "Everything-$env:EVERYTHING_VERSION.x64-Setup.exe"
          Invoke-WebRequest "https://www.voidtools.com/$fileName" -OutFile $fileName
          $actual = (Get-FileHash $fileName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EVERYTHING_INSTALLER_SHA256) {
            throw "Everything installer SHA-256 mismatch: $actual"
          }
          $dependencies = 'src/QuickSearch.Windows/dependencies'
          New-Item -ItemType Directory -Force $dependencies | Out-Null
          Copy-Item $fileName "$dependencies/Everything-Setup.exe"
          Set-Content "$dependencies/Everything-Setup.sha256" $actual -NoNewline

      - name: Restore
        run: dotnet restore QuickSearch.sln

      - name: Test
        run: dotnet test QuickSearch.sln -c Release --no-restore --verbosity minimal /p:Version=${{ steps.version.outputs.number }}

      - name: Publish self-contained win-x64 app
        run: dotnet publish src/QuickSearch.Windows/QuickSearch.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish /p:Version=${{ steps.version.outputs.number }} /p:FileVersion=${{ steps.version.outputs.assembly_number }} /p:AssemblyVersion=${{ steps.version.outputs.assembly_number }}

      - name: Verify published Windows app files
        shell: pwsh
        run: |
          $required = @(
            'artifacts/publish/QuickSearch.exe',
            'artifacts/publish/Everything64.dll',
            'artifacts/publish/QuickSearch.Core.dll',
            'artifacts/publish/dependencies/Everything-Setup.exe',
            'artifacts/publish/dependencies/Everything-Setup.sha256'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing publish output: $path" }
          }
          $publishedVersion = (Get-Item 'artifacts/publish/QuickSearch.exe').VersionInfo.ProductVersion
          if (-not $publishedVersion.StartsWith('${{ steps.version.outputs.number }}')) {
            throw "Published app version mismatch: $publishedVersion"
          }

      - name: Run configuration smoke test
        run: dotnet run --project tools/QuickSearch.Smoke/QuickSearch.Smoke.csproj -c Release

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $publish = (Resolve-Path artifacts/publish).Path
          $output = (Resolve-Path artifacts/installer).Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.number }}" "/DPublishDir=$publish" "/DOutputDir=$output" packaging/QuickSearch.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/installer/QuickSearch-Setup-v${{ steps.version.outputs.number }}.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not created' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$($installer.FullName).sha256" $hash -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: QuickSearch-${{ steps.version.outputs.tag }}-win-x64
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          $checksum = Get-Item "$($installer.FullName).sha256"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $installer.FullName $checksum.FullName --clobber
          } else {
            gh release create $tag $installer.FullName $checksum.FullName --target '${{ github.sha }}' --title "QuickSearch $tag" --generate-notes
          }
